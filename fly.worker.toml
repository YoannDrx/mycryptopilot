# Rename `app` once the Fly application is created (e.g., `mycryptopilot-worker`).
app = "mycryptopilot-worker"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  NODE_OPTIONS = "--max-old-space-size=384"

[processes]
  worker = "pnpm worker"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
